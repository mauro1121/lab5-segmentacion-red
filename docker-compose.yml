# ============================================================
# Laboratorio 5 - Segmentación de red (DESPUÉS / segmentado)
# Patrón: aislamiento por zonas con redes separadas de Docker.
#
# Zonas:
#   - Pública     : gateway (nginx)         -> public_net, app_net
#   - Aplicación  : backend (API /health)   -> app_net, data_net
#   - Datos       : db (PostgreSQL)          -> data_net
#
# Límite de confianza clave:
#   El gateway NO está en data_net, por lo tanto NO puede
#   alcanzar la base de datos. Solo el backend puede.
# ============================================================
services:
  gateway:
    image: nginx:alpine
    container_name: l5_gateway
    ports:
      - "80:80"            # Única puerta expuesta al exterior
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public_net         # expuesto al exterior
      - app_net            # puede hablar con el backend
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: l5_backend
    networks:
      - app_net            # recibe tráfico del gateway
      - data_net           # ÚNICO servicio con acceso a la db
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=app
      - DB_PASSWORD=app_secret
      - DB_NAME=appdb
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: l5_db
    networks:
      - data_net           # SOLO en la zona de datos
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_secret
      - POSTGRES_DB=appdb
    # NOTA: en el escenario segmentado NO se publica el puerto 5432,
    # por eso la prueba 5 (Exterior -> db) falla.

# ------------------------------------------------------------
# Tres redes = tres zonas. La clave de la segmentación:
#   - gateway y db NO comparten ninguna red en común.
#   - El backend es el único puente entre app_net y data_net.
# ------------------------------------------------------------
networks:
  public_net:
    driver: bridge
  app_net:
    driver: bridge
    internal: true         # sin salida a internet
  data_net:
    driver: bridge
    internal: true         # zona de datos totalmente interna
