# El gateway (zona pública) solo sabe reenviar al backend.
# No tiene forma de llegar a la base de datos: no está en data_net.
server {
    listen 80;
    server_name _;

    # Raíz: señal de vida del gateway (prueba 1: curl localhost)
    location / {
        default_type application/json;
        return 200 '{"service":"gateway","status":"ok"}';
    }

    # Proxy hacia el backend (zona de aplicación)
    location /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
    }
}
