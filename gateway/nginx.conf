# Gateway (zona pública). Solo sabe reenviar al backend bajo /api/.
# No tiene acceso a la base de datos: no está en data_net.
server {
    listen 80;
    server_name _;

    # Señal de vida del gateway (prueba 1: curl localhost)
    location / {
        default_type text/plain;
        return 200 'gateway ok';
    }

    # Proxy hacia el backend (zona de aplicación)
    #   curl localhost/api/health -> backend:3000/health
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
    }
}
