<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="720" viewBox="0 0 1040 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b7f3b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1040" height="720" fill="#f7f9fc"/>
  <text x="520" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d3d">Vista de despliegue – Segmentación de red por zonas</text>
  <text x="520" y="62" text-anchor="middle" font-size="14" fill="#5a6b7b">Patrón: aislamiento por zonas (límites de confianza) · Laboratorio 5 · escenario DESPUÉS (segmentado)</text>

  <!-- ZONA PÚBLICA -->
  <rect x="40" y="95" width="270" height="540" rx="14" fill="#eaf3ff" stroke="#2d77c9" stroke-width="2"/>
  <text x="175" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#2d77c9">ZONA PÚBLICA</text>
  <text x="175" y="142" text-anchor="middle" font-size="12" fill="#5a6b7b">public_net</text>

  <!-- ZONA APLICACIÓN -->
  <rect x="385" y="95" width="270" height="540" rx="14" fill="#eafaf0" stroke="#1b7f3b" stroke-width="2"/>
  <text x="520" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#1b7f3b">ZONA DE APLICACIÓN</text>
  <text x="520" y="142" text-anchor="middle" font-size="12" fill="#5a6b7b">app_net · internal: true</text>

  <!-- ZONA DATOS -->
  <rect x="730" y="95" width="270" height="540" rx="14" fill="#fdecef" stroke="#c0392b" stroke-width="2"/>
  <text x="865" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">ZONA DE DATOS</text>
  <text x="865" y="142" text-anchor="middle" font-size="12" fill="#5a6b7b">data_net · internal: true</text>

  <!-- Límites de confianza -->
  <line x1="347" y1="95" x2="347" y2="635" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="692" y1="95" x2="692" y2="635" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="692" y="658" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="600">límite de confianza crítico (pública ↔ datos)</text>

  <!-- Exterior -->
  <rect x="95" y="175" width="160" height="60" rx="10" fill="#ffffff" stroke="#2d77c9" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="175" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Exterior</text>
  <text x="175" y="220" text-anchor="middle" font-size="11" fill="#5a6b7b">usuario / atacante</text>

  <!-- gateway -->
  <rect x="95" y="315" width="160" height="80" rx="10" fill="#ffffff" stroke="#2d77c9" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="175" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">gateway</text>
  <text x="175" y="358" text-anchor="middle" font-size="11" fill="#5a6b7b">nginx · publica :80</text>
  <text x="175" y="373" text-anchor="middle" font-size="10" fill="#5a6b7b">proxy /api/ → backend</text>
  <text x="175" y="387" text-anchor="middle" font-size="10" fill="#5a6b7b">public_net + app_net</text>

  <!-- backend -->
  <rect x="440" y="315" width="160" height="80" rx="10" fill="#ffffff" stroke="#1b7f3b" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="520" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">backend</text>
  <text x="520" y="358" text-anchor="middle" font-size="11" fill="#5a6b7b">Node · GET /health · :3000</text>
  <text x="520" y="373" text-anchor="middle" font-size="10" fill="#5a6b7b">consulta PostgreSQL</text>
  <text x="520" y="387" text-anchor="middle" font-size="10" fill="#5a6b7b">app_net + data_net</text>

  <!-- db -->
  <rect x="785" y="315" width="160" height="80" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="865" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">db</text>
  <text x="865" y="358" text-anchor="middle" font-size="11" fill="#5a6b7b">PostgreSQL · :5432</text>
  <text x="865" y="373" text-anchor="middle" font-size="10" fill="#5a6b7b">sin "ports" (no publicada)</text>
  <text x="865" y="387" text-anchor="middle" font-size="10" fill="#5a6b7b">data_net</text>

  <!-- Flujos permitidos (verde) -->
  <line x1="175" y1="235" x2="175" y2="313" stroke="#1b7f3b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="187" y="280" font-size="11" fill="#1b7f3b">(1) HTTP :80</text>

  <line x1="255" y1="350" x2="438" y2="350" stroke="#1b7f3b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="341" font-size="11" fill="#1b7f3b">(2) /api/ → :3000</text>

  <line x1="600" y1="350" x2="783" y2="350" stroke="#1b7f3b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="648" y="341" font-size="11" fill="#1b7f3b">(3) :5432</text>

  <!-- Flujos bloqueados (rojo) -->
  <path d="M 175 395 C 175 480, 865 480, 865 397" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowRed)"/>
  <text x="520" y="502" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">(4) gateway → db  BLOQUEADO</text>
  <text x="520" y="519" text-anchor="middle" font-size="10" fill="#c0392b">DNS: "Try again" · por IP: timed out (no comparten red)</text>

  <path d="M 150 235 C 55 560, 55 560, 795 400" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowRed)"/>
  <text x="340" y="600" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">(5) Exterior → db :15432  BLOQUEADO</text>
  <text x="340" y="617" text-anchor="middle" font-size="10" fill="#c0392b">la db no publica puertos al host</text>

  <!-- Leyenda -->
  <rect x="720" y="150" width="268" height="72" rx="8" fill="#ffffff" stroke="#cfd8e3"/>
  <line x1="734" y1="172" x2="764" y2="172" stroke="#1b7f3b" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="772" y="176" font-size="11" fill="#1f2d3d">flujo permitido (app funciona)</text>
  <line x1="734" y1="200" x2="764" y2="200" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="772" y="204" font-size="11" fill="#1f2d3d">flujo bloqueado (ataque detenido)</text>
</svg>
