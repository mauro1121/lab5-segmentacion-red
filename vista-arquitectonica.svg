<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1b7f3b"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="680" fill="#f7f9fc"/>
  <text x="500" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2d3d">Vista de despliegue – Segmentación de red por zonas</text>
  <text x="500" y="62" text-anchor="middle" font-size="14" fill="#5a6b7b">Patrón: aislamiento por zonas (límites de confianza) · Laboratorio 5</text>

  <!-- ZONA PÚBLICA -->
  <rect x="40" y="95" width="260" height="520" rx="14" fill="#eaf3ff" stroke="#2d77c9" stroke-width="2"/>
  <text x="170" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#2d77c9">ZONA PÚBLICA</text>
  <text x="170" y="142" text-anchor="middle" font-size="12" fill="#5a6b7b">public_net</text>

  <!-- ZONA APLICACIÓN -->
  <rect x="370" y="95" width="260" height="520" rx="14" fill="#eafaf0" stroke="#1b7f3b" stroke-width="2"/>
  <text x="500" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#1b7f3b">ZONA DE APLICACIÓN</text>
  <text x="500" y="142" text-anchor="middle" font-size="12" fill="#5a6b7b">app_net (internal)</text>

  <!-- ZONA DATOS -->
  <rect x="700" y="95" width="260" height="520" rx="14" fill="#fdecef" stroke="#c0392b" stroke-width="2"/>
  <text x="830" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">ZONA DE DATOS</text>
  <text x="830" y="142" text-anchor="middle" font-size="12" fill="#5a6b7b">data_net (internal)</text>

  <!-- Límites de confianza -->
  <line x1="335" y1="95" x2="335" y2="615" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="665" y1="95" x2="665" y2="615" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="665" y="640" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="600">límite de confianza crítico</text>

  <!-- Exterior -->
  <rect x="90" y="175" width="160" height="60" rx="10" fill="#ffffff" stroke="#2d77c9" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="170" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2d3d">Exterior</text>
  <text x="170" y="220" text-anchor="middle" font-size="11" fill="#5a6b7b">usuario / atacante</text>

  <!-- gateway -->
  <rect x="90" y="310" width="160" height="70" rx="10" fill="#ffffff" stroke="#2d77c9" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="170" y="337" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">gateway</text>
  <text x="170" y="356" text-anchor="middle" font-size="11" fill="#5a6b7b">nginx · :80</text>
  <text x="170" y="371" text-anchor="middle" font-size="10" fill="#5a6b7b">public_net + app_net</text>

  <!-- backend -->
  <rect x="420" y="310" width="160" height="70" rx="10" fill="#ffffff" stroke="#1b7f3b" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="500" y="337" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">backend</text>
  <text x="500" y="356" text-anchor="middle" font-size="11" fill="#5a6b7b">API /health · :3000</text>
  <text x="500" y="371" text-anchor="middle" font-size="10" fill="#5a6b7b">app_net + data_net</text>

  <!-- db -->
  <rect x="750" y="310" width="160" height="70" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.6" filter="url(#shadow)"/>
  <text x="830" y="337" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d3d">db</text>
  <text x="830" y="356" text-anchor="middle" font-size="11" fill="#5a6b7b">PostgreSQL · :5432</text>
  <text x="830" y="371" text-anchor="middle" font-size="10" fill="#5a6b7b">data_net</text>

  <!-- Flujos permitidos (verde) -->
  <line x1="170" y1="235" x2="170" y2="308" stroke="#1b7f3b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="182" y="278" font-size="11" fill="#1b7f3b">(1) HTTP :80</text>

  <line x1="250" y1="345" x2="418" y2="345" stroke="#1b7f3b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="300" y="336" font-size="11" fill="#1b7f3b">(2) :3000 /health</text>

  <line x1="580" y1="345" x2="748" y2="345" stroke="#1b7f3b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="628" y="336" font-size="11" fill="#1b7f3b">(3) :5432</text>

  <!-- Flujos bloqueados (rojo) -->
  <path d="M 170 380 C 170 470, 830 470, 830 382" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowRed)"/>
  <text x="500" y="492" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">(4) gateway → db  BLOQUEADO (no comparten red)</text>

  <path d="M 150 235 C 60 540, 60 540, 760 390" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arrowRed)"/>
  <text x="330" y="585" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="700">(5) Exterior → db  BLOQUEADO (puerto 5432 no publicado)</text>

  <!-- Leyenda -->
  <rect x="690" y="150" width="258" height="70" rx="8" fill="#ffffff" stroke="#cfd8e3"/>
  <line x1="704" y1="172" x2="734" y2="172" stroke="#1b7f3b" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="742" y="176" font-size="11" fill="#1f2d3d">flujo permitido</text>
  <line x1="704" y1="198" x2="734" y2="198" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <text x="742" y="202" font-size="11" fill="#1f2d3d">flujo bloqueado</text>
</svg>
