# ============================================================
# Laboratorio 5 - Segmentación de red (ANTES / sin segmentar)
# Todo en la red por defecto: cualquier servicio llega a cualquiera.
#
# Aquí el gateway SÍ puede alcanzar la db (prueba 4 conecta)
# y el puerto 5432 está publicado (prueba 5 conecta).
# Este es el escenario inseguro que vamos a corregir.
# ============================================================
services:
  gateway:
    image: nginx:alpine
    container_name: l5_gateway
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    # Sin bloque 'networks': usa la red por defecto del compose

  backend:
    build: ./backend
    container_name: l5_backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=app
      - DB_PASSWORD=app_secret
      - DB_NAME=appdb
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: l5_db
    ports:
      - "5432:5432"        # Puerto publicado -> la prueba 5 conecta
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_secret
      - POSTGRES_DB=appdb

# Sin bloque 'networks': Compose crea una sola red por defecto
# y los tres servicios quedan juntos en ella.
